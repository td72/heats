[window]
width = 600.0
height = 400.0

# "normal" = マウスカーソルのあるディスプレイに表示 (デフォルト)
# "fixed"  = 指定ディスプレイに固定 (AeroSpace等のタイリングWM向け)
mode = "fixed"

# fixed モード時のディスプレイ名 (部分一致)
# 例: "LG", "Built-in", "DELL" など
# 空欄の場合は起動時のマウスカーソル位置のディスプレイを使用
display = "LG"

# --- Provider: source (一覧取得) + action (実行) の組み合わせ ---
#
# source / action はコマンドパイプラインとして二重配列で指定:
#   [["cmd1", "arg"], ["cmd2"]]  → cmd1 arg | cmd2
#
# field の値をアクションに渡す方法は自動判定:
#   - {} プレースホルダがあれば、その位置に値を展開 (arg モード)
#   - {} がなければ、最初のコマンドの stdin に値を渡す (stdin モード)

[provider.open-apps]
source = [["heats-list-apps"]]
action = [["open", "-a", "{}"]]
field = "data.path"
cache_interval = 3600

# --- 代替アクション: キーバインドで選択 ---
# field を省略するとプロバイダのデフォルト field を使用
[provider.open-apps.actions.reveal]
command = [["open", "-R", "{}"]]

[provider.open-apps.actions.copy-path]
command = [["pbcopy"]]
field = "title"

[provider.focus-window]
source = [["heats-list-windows"]]
action = [["heats-focus-window", "{}"]]
field = "data.pid"

# --- Evaluator: クエリを受け取り結果を返す (電卓など) ---

[evaluator.calculator]
source = [["heats-eval-calc"]]
action = [["pbcopy"]]
field = "data"

# --- Mode: hotkey → providers + evaluators のマッピング ---

[[mode]]
name = "launcher"
hotkey = "Cmd+Semicolon"
providers = ["open-apps"]
evaluators = ["calculator"]

# --- キーバインド → アクション名マッピング ---
[mode.keybindings]
"Alt+Enter" = "reveal"
"Alt+C" = "copy-path"

# --- Provider: pbring (クリップボード履歴) ---
# 前提: pbring がインストール済みで pbringd が起動していること
# https://github.com/td72/pbring
#
# パイプライン例: pbring decrypt の出力を pbcopy に渡す
# {} は data.id の値に展開される

[provider.clipboard]
source = [["heats-list-pbring"]]
action = [["pbring", "get"], ["pbcopy"]]
field = "data.id"

[provider.clipboard.actions.delete]
command = [["pbring", "delete"]]
field = "data.id"

[[mode]]
name = "windows"
hotkey = "Cmd+Quote"
providers = ["focus-window"]

[[mode]]
name = "clipboard"
hotkey = "Cmd+Shift+V"
providers = ["clipboard"]

[mode.keybindings]
"Alt+D" = "delete"
